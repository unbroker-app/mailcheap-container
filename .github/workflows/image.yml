name: Build, test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mailcheap:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Hardened runtime, database wait and persistence across restart
        run: node smoke.mjs
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image with an immutable source tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/unbroker-app/mailcheap-container
          REVISION: ${{ github.sha }}
        run: |
          docker tag mailcheap:test "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:sha-$REVISION"
